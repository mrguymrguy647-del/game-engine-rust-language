[package]
name = "tiny_engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "A small game engine (2D, 3D and physics), written for learning Rust"

[features]
default = ["gpu"]
# Draw 3D on the graphics card with wgpu. Build with `--no-default-features`
# for a smaller, faster-compiling engine that draws everything on the CPU.
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
minifb = "0.28"
wgpu = { version = "30", optional = true }
pollster = { version = "1", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }

# Optimize a little even in debug builds, so games run smoothly with a
# plain `cargo run` (the default debug build is very slow for pixel work).
[profile.dev]
opt-level = 1
